<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

/* Header */
header{
    text-align: center;
    padding: 0;
    margin: 0;
}

.header-img{
    width: 100%;
    height: auto;
    display: block;
}
nav{
    background:#333;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:18px;
    font-weight:bold;
}

nav a:hover{
    color:yellow;
}

/* Title */
.title{
    text-align:center;
    margin:40px 0 20px;
}

.title h2{
    color:#0b4f6c;
    font-size:35px;
}

.title p{
    margin-top:10px;
    color:#555;
}

/* Product Cards */
.products{
    width:90%;
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h3{
    text-align:center;
    margin:15px 0 10px;
    color:#0b4f6c;
}

.card p{
    text-align:center;
    color:#666;
    padding:0 15px;
}

.price{
    text-align:center;
    font-size:20px;
    color:red;
    font-weight:bold;
    margin:15px 0;
}

button{
    display:block;
    margin:15px auto 20px;
    background:#0b4f6c;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#08384d;
}

/* Footer */
footer{
    background:#0b4f6c;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}
</style>

</head>
