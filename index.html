<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saravana Traders</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

/* Header */
header{
    background:#0b4f6c;
    color:white;
    text-align:center;
    padding:20px;
}

/* Navigation */
nav{
    background:#333;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:18px;
    font-weight:bold;
}

nav a:hover{
    color:yellow;
}

/* Hero */
.hero{
    text-align:center;
    margin:30px 0;
}

.hero img{
    width:70%;
    max-width:900px;
    border-radius:10px;
}

/* Products */
.products{
    width:90%;
    margin:40px auto;
}

.products h2{
    text-align:center;
    margin-bottom:30px;
    color:#0b4f6c;
}

.product-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
}

.card{
    width:220px;
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    text-align:center;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:8px;
}

.card h3{
    margin-top:10px;
}

/* Footer */
footer{
    background:#0b4f6c;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:50px;
}
</style>

</head>

<body>

<header>
    <h1>Saravana Traders</h1>
    <p>Your Trusted Trading Partner</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
</nav>

<section class="hero">
    <img src="images/logo.png" alt="Saravana Traders">
</section>

<section class="products">

<h2>product offers</h2>

<div class="product-container">

<div class="hero">
<img src="images/logo.jpg" alt="Saravana Traders">
</div>

<div class="hero">
<img src="images/logo (2).jpg" alt="Saravana Traders">
</div>

<div class="hero">
<img src="images/logo (3).jpg" alt="Saravana Traders">
</div>

</div>

</section>

<footer>
<p>&copy; 2026 Saravana Traders. All Rights Reserved.</p>
</footer>

</body>
</html>
